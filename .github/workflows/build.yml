name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # ubuntu-22.04:p4a/buildozer 广泛验证过的环境(24.04 有 autoconf/libtool 兼容坑)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libtool-bin autopoint pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython
          pip install --user --upgrade buildozer

      - name: Cache buildozer (SDK/NDK/p4a)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          # 严格精确匹配(spec 变了就全新构建,避免旧 p4a/损坏产物混入)
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK (debug)
        run: |
          cd ${{ github.workspace }}
          export PATH=$PATH:$HOME/.local/bin
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virtualcat-apk
          path: bin/*.apk
